<header class="bg-surface border-b border-outline-variant fixed top-0 w-full z-50">
  <div class="flex justify-between items-center w-full px-lg h-16 max-w-container-max mx-auto">
    <div class="flex items-center gap-sm">
      <span class="material-symbols-outlined text-primary text-[24px]" data-icon="school">school</span>
      <span class="text-headline-md font-headline-md text-primary font-bold">EduTools</span>
    </div>
    <nav class="hidden md:flex items-center gap-lg ml-xl">
      <a class="text-label-lg font-label-lg text-on-surface-variant hover:text-primary transition-colors"
        routerLink="/home">Home</a>
      <a class="text-label-lg font-label-lg text-on-surface-variant hover:text-primary transition-colors"
        routerLink="/about">Quiénes Somos</a>
      <a class="text-label-lg font-label-lg text-on-surface-variant hover:text-primary transition-colors"
        routerLink="/dashboard">Dashboard</a>
        
      <!-- Login / Logout / Profile -->
      <div class="ml-4 pl-4 border-l border-outline-variant relative">
        <a *ngIf="!isLoggedIn" routerLink="/login" class="text-label-lg font-bold text-primary hover:underline cursor-pointer">Iniciar Sesión</a>
        
        <div *ngIf="isLoggedIn" class="relative">
          <button (click)="menuPerfilAbierto = !menuPerfilAbierto" class="w-10 h-10 rounded-full bg-secondary text-white flex items-center justify-center font-bold hover:ring-2 hover:ring-primary transition-all shadow-md">
            <span>AA</span>
          </button>
          
          <div *ngIf="menuPerfilAbierto" class="absolute right-0 mt-2 w-48 bg-white dark:bg-[#1e1e1e] border border-outline-variant dark:border-outline rounded-lg shadow-lg overflow-hidden animate-fade-in z-50">
             <a routerLink="/dashboard" [queryParams]="{ seccion: 'configuracion' }" (click)="menuPerfilAbierto = false" class="block px-4 py-3 text-sm font-bold hover:bg-gray-100 cursor-pointer dark:hover:bg-[#2d2d2d] flex items-center gap-2 border-b border-outline-variant dark:border-outline text-black dark:text-white">
               <span class="material-symbols-outlined text-[18px]">settings</span> Configuración
             </a>
             <a (click)="logout()" class="block px-4 py-3 text-sm font-bold text-red-600 hover:bg-red-50 cursor-pointer flex items-center gap-2">
               <span class="material-symbols-outlined text-[18px]">logout</span> Cerrar Sesión
             </a>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
