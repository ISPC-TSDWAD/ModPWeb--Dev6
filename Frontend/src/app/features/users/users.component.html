<div class="container mt-4">
  <h2>Gestión de Usuarios</h2>
  
  <button class="btn btn-primary mb-3" (click)="openNewUserForm()">Nuevo Usuario</button>

  <app-user-form 
    *ngIf="showForm" 
    [user]="selectedUser" 
    (saved)="onFormSaved()" 
    (canceled)="onFormCanceled()">
  </app-user-form>

  <table class="table table-striped" *ngIf="!showForm">
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Email</th>
        <th>Nombre</th>
        <th>Admin</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.first_name }} {{ u.last_name }}</td>
        <td>{{ u.is_staff ? 'Sí' : 'No' }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="editUser(u)">Editar</button>
          <button class="btn btn-sm btn-danger" (click)="deleteUser(u.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
