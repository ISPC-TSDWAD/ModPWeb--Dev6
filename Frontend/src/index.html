<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EduTools</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Tailwind CSS & Fonts from mockup -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary-container": "#354f5b", "surface-container-high": "#e7e8e9", "tertiary-fixed": "#cbe7f5",
            "tertiary-fixed-dim": "#afcbd8", "error": "#ba1a1a", "primary": "#003761", "on-primary": "#ffffff",
            "surface-tint": "#336191", "on-surface-variant": "#42474f", "on-tertiary": "#ffffff",
            "on-primary-fixed-variant": "#144978", "surface": "#f8f9fa", "secondary-fixed-dim": "#82d3de",
            "on-tertiary-container": "#a5c0ce", "on-surface": "#191c1d", "primary-fixed-dim": "#9fcaff",
            "inverse-primary": "#9fcaff", "on-primary-fixed": "#001d36", "tertiary": "#1e3843",
            "surface-container-highest": "#e1e3e4", "surface-container": "#edeeef", "secondary": "#006972",
            "on-tertiary-fixed-variant": "#304a55", "outline": "#727780", "on-secondary-container": "#066f79",
            "surface-dim": "#d9dadb", "on-error-container": "#93000a", "error-container": "#ffdad6",
            "background": "#f8f9fa", "secondary-container": "#9ff0fb", "outline-variant": "#c2c7d0",
            "on-error": "#ffffff", "primary-container": "#1c4e7d", "surface-container-lowest": "#ffffff",
            "on-tertiary-fixed": "#021f29", "surface-bright": "#f8f9fa", "surface-variant": "#e1e3e4",
            "on-secondary-fixed-variant": "#004f56", "on-background": "#191c1d", "surface-container-low": "#f3f4f5",
            "on-secondary-fixed": "#001f23", "inverse-surface": "#2e3132", "secondary-fixed": "#9ff0fb",
            "on-secondary": "#ffffff", "on-primary-container": "#94c0f5", "primary-fixed": "#d2e4ff",
            "inverse-on-surface": "#f0f1f2"
          },
          "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
          "spacing": { "base": "4px", "sidebar-width": "300px", "lg": "24px", "xs": "4px", "sm": "8px", "xl": "32px", "container-max": "1200px", "md": "16px", "gutter": "20px" },
          "fontFamily": { "label-md": ["Inter"], "body-lg": ["Inter"], "display-lg": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Inter"], "label-lg": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"], "headline-lg": ["Inter"] },
          "fontSize": {
            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
            "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "headline-md": ["22px", {"lineHeight": "30px", "fontWeight": "600"}],
            "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "headline-sm": ["18px", {"lineHeight": "26px", "fontWeight": "600"}],
            "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "600"}]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', sans-serif; }

    /* Dirección LTR base en editor y vista previa.
       Importante: NO forzar text-align aquí, para no romper los botones de
       alineación (centrar/derecha/justificar) del editor. El aislamiento bidi
       evita el "texto al revés" sin pisar la alineación de los bloques hijos. */
    #rich-editor,
    #preview-container {
      direction: ltr;
      unicode-bidi: isolate;
    }

    /* Foco visible para accesibilidad de la interfaz del sandbox */
    #rich-editor:focus-visible,
    .sandbox-toolbar button:focus-visible,
    .sandbox-toolbar select:focus-visible {
      outline: 2px solid #003761;
      outline-offset: 2px;
    }

    /* Guías de edición: etiquetas visuales sobre pestañas/secciones.
       Son pseudo-elementos (::before/::after), por lo que NO se guardan en el
       HTML del recurso: sólo ayudan a ver qué es título y qué es contenido. */
    #rich-editor.guias-edicion .dp-panels-wrapper { counter-reset: dp-panel; }
    #rich-editor.guias-edicion .dp-panel-group {
      counter-increment: dp-panel;
      position: relative;
      border: 1px dashed #8a8f98;
      border-radius: 8px;
      padding: 18px 10px 12px;
      margin: 14px 0;
    }
    #rich-editor.guias-edicion .dp-panel-group::before {
      content: "Panel " counter(dp-panel);
      position: absolute;
      top: -10px;
      left: 10px;
      background: #003761;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 10px;
    }
    #rich-editor.guias-edicion .dp-tabs .dp-panel-group::before { content: "Pestaña " counter(dp-panel); }
    #rich-editor.guias-edicion .dp-accordion-default .dp-panel-group::before { content: "Sección " counter(dp-panel); }
    #rich-editor.guias-edicion .dp-panel-heading {
      position: relative;
      border-left: 4px solid #006972;
      padding-left: 10px;
    }
    #rich-editor.guias-edicion .dp-panel-heading::after {
      content: "TÍTULO";
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
      background: #006972;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 1px 6px;
      border-radius: 8px;
    }
    #rich-editor.guias-edicion .dp-panel-content {
      border-left: 4px solid #c2c7d0;
      padding-left: 10px;
      margin-top: 6px;
    }
    #rich-editor.guias-edicion .dp-panel-content::before {
      content: "CONTENIDO";
      display: block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #727780;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
